<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Audio Spectrum Display</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:20px;
}

#freq_display {
  /*border: 2px solid #777;*/
}
#freq_scale{
    display:inline-block;
    margin-top:8px;
    color:#CCC;
    font-size:14px;
    padding:0 6px;
}
#freq_scale span {
  margin: 0 8px;
}
table{
    margin:auto;
    border-collapse:collapse;
}

td{
    width:25px;
    height:30px;
    border:10px solid #222;
    background:#000;
    transition:0.05s;
}

.green{
    background:#2AFFB0;
}

.yellow{
    background:#FFF12A;
}

.red{
    background:#FF2A5B;
}

button{
    padding:8px 15px;
    font-size:16px;
    margin-bottom:20px;
    color: white;
    background-color: #444;
}
.container{
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    width:400px;
    margin-top: 20px;
}

#slider{
    width:300px;
    cursor:pointer;
}

#value{
    margin-top:10px;
    font-size:25px;
    font-weight:bold;
    color:white;
}
</style>
</head>
<body>

<h2>Audio Spectrum Display</h2>

<button id="startBtn">Start Microphone</button>

<div id="freq_display">
  <table id="grid"></table>
<div id="freq_scale">
    <span>80</span>
    <span>150</span>
    <span>300</span>
    <span>600</span>
    <span>1k</span>
    <span>2k</span>
    <span>4k</span>
    <span>8k</span>
</div>
</div>

<div class="container">
    <p>Input Volume</p>
    <input type="range" id="slider" min="50" max="150" value="100">
    <div id="value">100%</div>
</div>

<script> 
// ===== Slider Level =====
const slider = document.getElementById('slider');
const value = document.getElementById('value');
slider.addEventListener('input', () => {
    value.textContent = `${slider.value}%`;
});

const SIZE = 8;
const table = document.getElementById("grid");

// ===== 8x8 Pixel Grid =====
for(let r=0;r<10;r++){
    const tr=document.createElement("tr");

    for(let c=0;c<SIZE;c++){
        const td=document.createElement("td");
        td.id=`p-${r}-${c}`;
        tr.appendChild(td);
    }

    table.appendChild(tr);
}

function drawBands(levels){

    for(let row=0; row<10; row++){

        for(let col=0; col<SIZE; col++){

            const pixel=document.getElementById(
                `p-${row}-${col}`
            );

            pixel.className="";

            const level=levels[col];

            const pixelLevel = 10-row;

            if(pixelLevel <= level){

                if(pixelLevel <= 6)
                    pixel.classList.add("green");

                else if(pixelLevel <= 8)
                    pixel.classList.add("yellow");

                else
                    pixel.classList.add("red");
            }
        }
    }
}

document.getElementById("startBtn")
.addEventListener("click", async ()=>{

    const stream =
        await navigator.mediaDevices.getUserMedia({
            audio:true
        });

const audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();

    // 👉 FIX FOR MOBILE: Resume context if suspended by browser policy
    if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
    }

    const analyser =
        audioCtx.createAnalyser();

    analyser.fftSize = 1024;

    const source =
        audioCtx.createMediaStreamSource(stream);

    source.connect(analyser);

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    function animate(){

        analyser.getByteFrequencyData(data);

const levels = [];

const BANDS = [
    { start: 1,   end: 2   }, // 80Hz
    { start: 3,   end: 7   }, // 150Hz
    { start: 8,   end: 14  }, // 300Hz
    { start: 15,  end: 24  }, // 600Hz
    { start: 25,  end: 47  }, // 1k
    { start: 48,  end: 93  }, // 2k
    { start: 110, end: 170 }, // 4k // 94-186
    { start: 195, end: 265 }  // 8k // 187-279
];

for(const band of BANDS){

    let sum = 0;
    let count = 0;

    for(let i = band.start; i <= band.end; i++){

        sum += data[i];
        count++;
    }

    let avg = sum / count;

    // Increase/Decrease Microphone levels
    avg *= slider.value/100;

    let level = Math.round(
        avg / 255 * 10
    );

   level = Math.max(0,Math.min(10, level)
   );

    levels.push(level);
}

        drawBands(levels);

        requestAnimationFrame(
            animate
        );
    }

    animate();
});
</script>

</body>
</html>
